<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — Ritesh Bhandari</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><link rel="stylesheet" href="/style.css">
<style>body::after{display:none}.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.bar input,.bar select{width:auto;flex:1;min-width:140px;border:2px solid var(--line);padding:10px;border-radius:8px}.row{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:14px}.row summary{cursor:pointer;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}.row dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:14px 0}.row dt{color:var(--mut)}.row dd{white-space:pre-wrap;word-break:break-word}.tag{background:var(--lime);color:#0d0d0f;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}.acts{display:flex;gap:8px;flex-wrap:wrap}.acts select{width:auto}.btn.sm{padding:8px 16px}.danger{background:#d0222d}#login{max-width:360px;margin:20vh auto;display:grid;gap:16px;grid-template-columns:1fr}</style></head>
<body><div class="wrap"><form id="login" hidden><h1 style="font-size:2rem">Admin login</h1><div><label for="u">Username</label><input id="u" autocomplete="username"></div><div><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"></div><div class="er" id="le" role="alert"></div><button class="btn" type="submit">Sign in</button></form>
<div id="dash" hidden><div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:2rem">Enquiries <span id="cnt" class="lab" style="display:inline"></span></h1><button class="btn sm" id="out">Log out</button></div>
<div class="bar"><input id="q" type="search" placeholder="Search name, email, company, message…" aria-label="Search"><select id="st" aria-label="Filter status"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>In Progress</option><option>Completed</option></select></div><div id="list"></div></div></div>
<script>
var CSRF='',OPEN={};var $=function(s){return document.querySelector(s)},S=['New','Contacted','In Progress','Completed'];
function api(u,o){o=o||{};o.headers={'Content-Type':'application/json'};if(o.method&&o.method!=='GET')o.headers['X-CSRF-Token']=CSRF;o.credentials='same-origin';return fetch(u,o).then(function(r){if(r.status===401){lg(true);throw 0}return r.json()})}
function lg(s){$('#login').hidden=!s;$('#dash').hidden=s}
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function load(){var q=encodeURIComponent($('#q').value),s=encodeURIComponent($('#st').value);api('/api/admin/enquiries?q='+q+'&status='+s).then(function(rows){lg(false);$('#cnt').textContent='('+rows.length+')';var L=$('#list');L.replaceChildren();if(!rows.length)L.append(mk('p','lab','No enquiries found.'));rows.forEach(function(r){var d=mk('details','row'),sm=mk('summary');d.open=!!OPEN[r.id];d.addEventListener('toggle',function(){OPEN[r.id]=d.open});sm.append(mk('b',0,'#'+r.id+' '+r.name),mk('span',0,r.service||'—'),mk('span','tag',r.status),mk('small',0,r.created_at+' UTC'));d.append(sm);var dl=mk('dl');[['Email',r.email],['Phone',r.phone],['Company',r.company],['Project type',r.project_type],['Budget',r.budget],['Timeline',r.timeline],['Message',r.message],['Emailed',r.emailed?'Yes':'No (check SMTP)']].forEach(function(p){dl.append(mk('dt',0,p[0]),mk('dd',0,p[1]||'—'))});d.append(dl);
var a=mk('div','acts'),sel=mk('select');S.forEach(function(x){var o=mk('option',0,x);o.selected=x===r.status;sel.append(o)});sel.setAttribute('aria-label','Status');sel.onchange=function(){api('/api/admin/enquiries/'+r.id,{method:'PATCH',body:JSON.stringify({status:sel.value})}).then(load)};
var rp=mk('a','btn sm','Reply');rp.href='mailto:'+r.email;var del=mk('button','btn sm danger','Delete');del.onclick=function(){if(confirm('Delete enquiry #'+r.id+' permanently?'))api('/api/admin/enquiries/'+r.id,{method:'DELETE'}).then(load)};a.append(sel,rp,del);d.append(a);L.append(d)})}).catch(function(){})}
$('#login').onsubmit=function(e){e.preventDefault();fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})}).then(function(r){return r.json().then(function(j){if(r.ok){$('#p').value='';fetch('/api/admin/me',{credentials:'same-origin'}).then(function(x){return x.json()}).then(function(m){CSRF=m.csrf;load()})}else $('#le').textContent=j.error||'Login failed'})})};
$('#out').onclick=function(){fetch('/api/admin/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(){lg(true)})};
var t;$('#q').oninput=function(){clearTimeout(t);t=setTimeout(load,250)};$('#st').onchange=load;
fetch('/api/admin/me',{credentials:'same-origin'}).then(function(r){r.ok?r.json().then(function(m){CSRF=m.csrf;load()}):lg(true)});
</script></body></html>
